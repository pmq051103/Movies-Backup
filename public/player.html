<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Không Gian Phim Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #player { width: 100%; height: 100%; }

  /* =================================================================
     MODERN PLAYER THEME
     A restyle layered on top of Artplayer 5.4.0. Nothing here touches
     interaction/pointer-events on the video or the control bar — the
     bar uses Artplayer's own native show/hide (no CSS hover-gate), so
     clicking the video, the settings gear, and every control keeps
     working exactly like stock Artplayer. This block only changes how
     things LOOK: colors, spacing, rounded progress bar, glassy panels.
     ================================================================= */
  :root {
    --kgp-accent: #FECF59;
    --kgp-accent-strong: #ffdd7a;
  }

  /* Softer, taller gradient scrim behind the bottom bar. */
  .art-video-player .art-bottom {
    padding: 40px 14px 10px !important;
    background: linear-gradient(
      to top,
      rgba(0, 0, 0, 0.85) 0%,
      rgba(0, 0, 0, 0.55) 45%,
      rgba(0, 0, 0, 0) 100%
    ) !important;
  }

  /* Progress bar — thicker, rounded, accent-colored. */
  .art-video-player .art-progress { height: 22px !important; }
  .art-video-player .art-progress .art-control-progress-inner {
    height: 5px !important;
    border-radius: 999px;
    transition: height 0.15s ease;
  }
  .art-video-player .art-progress:hover .art-control-progress-inner {
    height: 8px !important;
  }
  .art-video-player .art-progress .art-progress-loaded {
    background: rgba(255, 255, 255, 0.28) !important;
    border-radius: 999px;
  }
  .art-video-player .art-progress .art-progress-played {
    background: linear-gradient(90deg, var(--kgp-accent), var(--kgp-accent-strong)) !important;
    border-radius: 999px;
  }
  .art-video-player .art-progress .art-progress-highlight { border-radius: 999px; }
  .art-video-player .art-progress .art-progress-indicator {
    width: 15px !important;
    height: 15px !important;
    margin-left: -7px !important;
    top: -5px !important;
    background: var(--kgp-accent) !important;
    box-shadow: 0 0 0 4px rgba(254, 207, 89, 0.25), 0 2px 6px rgba(0, 0, 0, 0.5) !important;
    transition: transform 0.15s ease;
  }
  .art-video-player .art-progress:hover .art-progress-indicator { transform: scale(1.15); }

  /* Control buttons — subtle hover chip + accent glow. */
  .art-video-player .art-control {
    transition: color 0.15s ease, transform 0.12s ease;
  }
  .art-video-player .art-controls .art-control:hover {
    color: var(--kgp-accent) !important;
    transform: translateY(-1px);
  }
  .art-video-player .art-control svg { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6)); }

  /* Volume slider + time text. */
  .art-video-player .art-control-volume .art-volume-panel { border-radius: 999px; }
  .art-video-player .art-control-volume .art-volume-inner { background: var(--kgp-accent) !important; }
  .art-video-player .art-control-time {
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
  }

  /* Big center state icon (play/pause flash) — glassy circle. */
  .art-video-player .art-state {
    background: rgba(0, 0, 0, 0.4) !important;
    border-radius: 999px !important;
    padding: 18px !important;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  /* Loading spinner accent. */
  .art-video-player .art-loading svg circle { stroke: var(--kgp-accent) !important; }

  /* Settings / info panels — dark glass, rounded, accent selection. */
  .art-video-player .art-settings,
  .art-video-player .art-info {
    background: rgba(20, 22, 30, 0.92) !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    border-radius: 14px !important;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55) !important;
    overflow: hidden;
  }
  .art-video-player .art-setting-item:hover {
    background: rgba(255, 255, 255, 0.07) !important;
  }
  .art-video-player .art-setting-item.art-current,
  .art-video-player .art-setting-item[data-value].art-current {
    color: var(--kgp-accent) !important;
  }
  .art-video-player .art-selector-value { color: var(--kgp-accent) !important; }

  /* Tooltip pill. */
  .art-video-player .art-notice-inner,
  .art-video-player [class*="art-tooltip"] {
    border-radius: 8px !important;
  }

  /* Contextmenu — hide the default Artplayer credit line, keep it clean. */
  .art-video-player .art-contextmenus {
    background: rgba(20, 22, 30, 0.95) !important;
    border-radius: 12px !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
  }

  /* ── Mobile control-bar fix ──────────────────────────────────────
     Verified against Artplayer 5.4.0's actual source: the bottom bar on
     a phone (rewind, play/pause, forward, volume, time, setting, pip,
     fullscreen) is too wide, pushing fullscreen off the right edge.
     Fix: play/pause + rewind/forward move to a big center overlay on the
     video (#kgp-center-controls below), so their bottom-bar copies are
     hidden on mobile — freeing the row so fullscreen fits. */
  @media (max-width: 480px) {
    .art-video-player .art-bottom { padding: 30px 8px 8px !important; }
    .art-bottom .art-control-fast-rewind,
    .art-bottom .art-control-fast-forward,
    .art-bottom .art-control-playAndPause {
      display: none !important;
    }
    .art-controls,
    .art-controls-left,
    .art-controls-right {
      gap: 2px !important;
    }
    .art-control {
      padding: 0 4px !important;
    }
    .art-icon svg {
      width: 20px !important;
      height: 20px !important;
    }
    .art-controls {
      overflow-x: auto !important;
      scrollbar-width: none !important;
    }
    .art-controls::-webkit-scrollbar {
      display: none !important;
    }
    /* Artplayer's own big center "state" icon would double up behind our
       overlay buttons — hide it on mobile only. */
    .art-mask .art-state {
      display: none !important;
    }
  }

  /* ── Center overlay controls (play/pause + ±10s) ─────────────────
     Mobile-only, YouTube-style big thumb-friendly buttons on the video.
     Hidden by default; shown only under the max-width:480px query and
     only while the controls are visible (.art-control-show/.art-hover),
     fading out with them via Artplayer's own auto-hide timer. */
  #kgp-center-controls { display: none; }
  @media (max-width: 480px) {
    #kgp-center-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      width: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--art-transition-duration, .2s) ease;
    }
    .art-video-player.art-control-show #kgp-center-controls,
    .art-video-player.art-hover #kgp-center-controls {
      opacity: 1;
    }
    #kgp-center-controls button { pointer-events: none; }
    .art-video-player.art-control-show #kgp-center-controls button,
    .art-video-player.art-hover #kgp-center-controls button {
      pointer-events: auto;
    }
    #kgp-center-controls button {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      border: none;
      border-radius: 999px;
      color: #fff;
      padding: 0;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #kgp-center-controls .kgp-seek-btn { width: 44px; height: 44px; }
    #kgp-center-controls .kgp-seek-btn svg { width: 24px; height: 24px; }
    #kgp-center-controls .kgp-play-btn {
      width: 64px;
      height: 64px;
      background: var(--kgp-accent);
      color: #17140a;
    }
    #kgp-center-controls .kgp-play-btn svg { width: 32px; height: 32px; }
  }

  /* ── "Bật tiếng" (unmute) pill ──────────────────────────────────── */
  #kgp-unmute { display: none; }
  #kgp-unmute.show {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .art-layer-kgp-unmute {
    bottom: 8px;
    transition: bottom var(--art-transition-duration, .2s) ease;
  }
  .art-video-player.art-control-show .art-layer-kgp-unmute,
  .art-video-player.art-hover .art-layer-kgp-unmute {
    bottom: 60px;
  }
  #kgp-unmute .kgp-unmute-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: var(--kgp-accent);
    color: #17140a;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    box-shadow: 0 4px 16px rgba(254, 207, 89, 0.4);
  }
  #kgp-unmute .kgp-unmute-btn:hover { background: var(--kgp-accent-strong); }
  #kgp-unmute .kgp-unmute-btn svg { flex-shrink: 0; }
</style>
</head>
<body>
<div id="player"></div>

<!-- Same versions as player.phimapi.com -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.4.0/artplayer.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script>
(function () {
  'use strict';

  var params = new URLSearchParams(window.location.search);
  var videoUrl = params.get('url');
  if (!videoUrl) {
    document.body.innerHTML = '<p style="color:#fff;text-align:center;margin-top:40vh">No video URL provided.</p>';
    return;
  }

  // Determine if this is an m3u8 (HLS) or direct mp4 URL
  var isHls = /\.m3u8/i.test(videoUrl);

  var art = new Artplayer({
    container: '#player',
    url: videoUrl,
    muted: false,
    autoplay: true,
    autoSize: false,
    autoMini: true,
    loop: false,
    mutex: true,
    setting: true,
    pip: true,
    flip: false,
    lock: false,
    fastForward: true,
    playbackRate: true,
    aspectRatio: true,
    theme: '#FECF59',
    fullscreen: true,
    fullscreenWeb: false,
    miniProgressBar: true,
    autoOrientation: true,
    lang: 'vietnamese',
    i18n: {
      vietnamese: {
        Play: 'Phát',
        Pause: 'Dừng',
        'Show Setting': 'Cài đặt',
        'PIP Mode': 'Ảnh-trong-ảnh',
        Fullscreen: 'Phóng to',
        'Play Speed': 'Tốc độ phát',
        'Aspect Ratio': 'Tỷ lệ khung hình',
        Normal: 'Bình thường',
        'Video Info': 'Thông tin Video',
        Close: 'Đóng',
        Default: 'Mặc định',
      },
    },
    // ── Modern icon set — overrides Artplayer 5.4.0's default control
    //    glyphs with cleaner, rounded Material-style SVGs (play/pause,
    //    volume, settings gear, PiP, fullscreen enter/exit, loading,
    //    and the big center state icon). currentColor lets the accent
    //    hover theming from the CSS keep working. ──
    icons: {
      play:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M7 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 0 0 0-1.68L8.54 5.98A1 1 0 0 0 7 6.82Z"/></svg>',
      pause:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M8 5a1.5 1.5 0 0 0-1.5 1.5v11a1.5 1.5 0 0 0 3 0v-11A1.5 1.5 0 0 0 8 5Zm8 0a1.5 1.5 0 0 0-1.5 1.5v11a1.5 1.5 0 0 0 3 0v-11A1.5 1.5 0 0 0 16 5Z"/></svg>',
      volume:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
      volumeClose:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>',
      setting:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>',
      pip:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 11h-6v5h6v-5zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>',
      fullscreenOn:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>',
      fullscreenOff:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>',
      loading:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="52" height="52"><circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 60"><animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="0.9s" repeatCount="indefinite"/></circle></svg>',
      state:
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48"><path fill="currentColor" d="M7 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 0 0 0-1.68L8.54 5.98A1 1 0 0 0 7 6.82Z"/></svg>',
    },
    layers: [
      {
        name: 'kgp-logo',
        html:
          '<a id="kgp-logo-link" style="display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);text-decoration:none;cursor:pointer;">' +
          '<img src="/logo.png" alt="Không Gian Phim" style="width:20px;height:20px;border-radius:999px;object-fit:cover;" />' +
          '<span style="font-size:12px;font-weight:600;color:#fff;white-space:nowrap;">Không Gian Phim</span>' +
          '</a>',
        style: {
          position: 'absolute',
          top: '12px',
          left: '12px',
          zIndex: 30,
          pointerEvents: 'auto',
        },
        click: function () {
          postToParent({ action: 'navigateHome' });
        },
      },
      {
        // Mobile-only overlay: play/pause + ±10s seek, centered on the
        // video. The wrapper is pointer-events:none so it never blocks
        // clicks on the video underneath; only the buttons re-enable them.
        name: 'kgp-center-controls',
        html:
          '<div id="kgp-center-controls">' +
            '<button type="button" class="kgp-seek-btn" aria-label="Tua lùi 10 giây" onclick="window.__kgpRewind(event)">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12.5 3a9 9 0 1 0 8.94 10.06 1 1 0 1 0-1.99-.23A7 7 0 1 1 12.5 5v2.5l4-3.5-4-3.5V3z" transform="scale(-1,1) translate(-24,0)"/><text x="12" y="16" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="currentColor">10</text></svg>' +
            '</button>' +
            '<button type="button" id="kgp-center-play-btn" class="kgp-play-btn" aria-label="Phát / Dừng" onclick="window.__kgpTogglePlay(event)">' +
              '<svg id="kgp-center-play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M7 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 0 0 0-1.68L8.54 5.98A1 1 0 0 0 7 6.82Z"/></svg>' +
            '</button>' +
            '<button type="button" class="kgp-seek-btn" aria-label="Tua tới 10 giây" onclick="window.__kgpForward(event)">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12.5 3a9 9 0 1 1-8.94 10.06 1 1 0 1 1 1.99-.23A7 7 0 1 0 12.5 5v2.5l-4-3.5 4-3.5V3z"/><text x="12" y="16" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="currentColor">10</text></svg>' +
            '</button>' +
          '</div>',
        style: {
          position: 'absolute',
          top: '0',
          left: '0',
          width: '100%',
          height: '100%',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          zIndex: 20,
          pointerEvents: 'none',
        },
      },
      {
        // Unmute pill — bottom-left, only shown while the muted-autoplay
        // fallback is active. Wrapper is pointer-events:none; only the
        // button re-enables clicks so it never blocks the video.
        name: 'kgp-unmute',
        html:
          '<div id="kgp-unmute">' +
            '<button type="button" class="kgp-unmute-btn" aria-label="Bật tiếng" onclick="window.__kgpUnmute(event)">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>' +
              '<span>Bật tiếng</span>' +
            '</button>' +
          '</div>',
        style: {
          position: 'absolute',
          left: '12px',
          zIndex: 50,
          pointerEvents: 'none',
        },
      },
    ],
    controls: [
      {
        position: 'left',
        name: 'fast-rewind',
        index: 10,
        html: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 3a9 9 0 1 0 8.94 10.06 1 1 0 1 0-1.99-.23A7 7 0 1 1 12.5 5v2.5l4-3.5-4-3.5V3z" transform="scale(-1,1) translate(-24,0)"/><text x="12" y="16" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="currentColor">10</text></svg>',
        tooltip: '10 giây trước',
        click: function () { art.seek = art.currentTime - 10; },
      },
      {
        position: 'left',
        name: 'fast-forward',
        index: 11,
        html: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 3a9 9 0 1 1-8.94 10.06 1 1 0 1 1 1.99-.23A7 7 0 1 0 12.5 5v2.5l-4-3.5 4-3.5V3z"/><text x="12" y="16" text-anchor="middle" font-family="Arial" font-size="8" font-weight="700" fill="currentColor">10</text></svg>',
        tooltip: '10 giây sau',
        click: function () { art.seek = art.currentTime + 10; },
      },
      {
        position: 'right',
        name: 'kgp-next-episode',
        index: 10,
        html: '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" d="M7 6.82v10.36c0 .79.87 1.27 1.54.84l6.9-4.39V17a1 1 0 0 0 2 0V7a1 1 0 0 0-2 0v3.37L8.54 5.98A1 1 0 0 0 7 6.82Z"/></svg>',
        tooltip: 'Tập tiếp theo',
        click: function () { postToParent({ action: 'nextEpisode' }); },
      },
    ],
    customType: isHls
      ? {
          m3u8: function (video, url) {
            if (Hls.isSupported()) {
              if (art.hls) art.hls.destroy();
              var hls = new Hls();
              hls.loadSource(url);
              hls.attachMedia(video);
              art.hls = hls;
              art.on('destroy', function () { hls.destroy(); });

              // ── Quality selector — only show if stream has multiple levels ──
              var qualityAdded = false;
              var hlsReady = false;
              var artReady = false;

              function tryAddQuality() {
                if (qualityAdded || !hlsReady || !artReady) return;
                var levels = hls.levels || [];
                if (levels.length <= 1) return;
                qualityAdded = true;

                function getLabel(level) {
                  var h = level.height || 0;
                  if (h >= 2160) return '4K';
                  if (h >= 1440) return '1440p';
                  if (h >= 1080) return '1080p';
                  if (h >= 720) return '720p';
                  if (h >= 480) return '480p';
                  if (h >= 360) return '360p';
                  if (h > 0) return h + 'p';
                  var bw = level.bitrate || 0;
                  if (bw >= 5000000) return 'FHD';
                  if (bw >= 2500000) return 'HD';
                  if (bw >= 1000000) return 'SD';
                  return 'SD';
                }

                var items = levels.map(function (lv, i) {
                  return { html: getLabel(lv), value: i };
                });
                items.sort(function (a, b) {
                  var ha = levels[a.value].height || 0;
                  var hb = levels[b.value].height || 0;
                  if (ha !== hb) return hb - ha;
                  return (levels[b.value].bitrate || 0) - (levels[a.value].bitrate || 0);
                });
                items.unshift({ html: 'Tự động', value: -1 });

                art.setting.add([{
                  html: 'Chất lượng',
                  width: 200,
                  tooltip: 'Tự động',
                  selector: items.map(function (it) {
                    return { html: it.html, value: it.value, default: it.value === -1 };
                  }),
                  onSelect: function (item) {
                    hls.currentLevel = item.value;
                    return item.html;
                  },
                }]);
              }

              // ── Language (audio track) selector — "song ngữ" streams ──
              var audioTrackAdded = false;

              function audioTrackLabel(track, index) {
                var raw = (track && (track.name || track.lang)) || '';
                var lower = raw.toLowerCase();
                if (/thuyết|thuyet|dub/.test(lower)) return 'Thuyết Minh';
                if (/lồng|long tieng|lồng tiếng/.test(lower)) return 'Lồng Tiếng';
                if (/vietsub|phụ đề|phu de|sub/.test(lower)) return 'Vietsub';
                return raw || 'Ngôn ngữ ' + (index + 1);
              }

              function tryAddAudioTrack() {
                if (audioTrackAdded || !hlsReady || !artReady) return;
                var tracks = hls.audioTracks || [];
                if (tracks.length <= 1) return;
                audioTrackAdded = true;

                var items = tracks.map(function (tr, i) {
                  return { html: audioTrackLabel(tr, i), value: i };
                });

                art.setting.add([{
                  html: 'Ngôn ngữ',
                  width: 200,
                  tooltip: audioTrackLabel(tracks[hls.audioTrack] || tracks[0], hls.audioTrack || 0),
                  selector: items.map(function (it) {
                    return { html: it.html, value: it.value, default: it.value === hls.audioTrack };
                  }),
                  onSelect: function (item) {
                    hls.audioTrack = item.value;
                    return item.html;
                  },
                }]);
              }

              hls.on(Hls.Events.MANIFEST_PARSED, function () {
                hlsReady = true;
                tryAddQuality();
                tryAddAudioTrack();
              });
              hls.on(Hls.Events.LEVEL_LOADED, function () {
                hlsReady = true;
                tryAddQuality();
              });
              art.on('ready', function () {
                artReady = true;
                tryAddQuality();
                tryAddAudioTrack();
              });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = url;
            }
          },
        }
      : undefined,
  });

  // ===================================================================
  // NOTE on click-to-pause: Artplayer binds this natively on the
  // <video> element (single click toggles play/pause on desktop). We do
  // NOT add a second click listener — a previous version did, and every
  // click bubbled to both handlers, toggling twice and cancelling out,
  // which is exactly why the player "did nothing" on click. Left to
  // Artplayer's own single-click handler with nothing fighting it.
  // ===================================================================

  // ===================================================================
  // iOS FULLSCREEN FIX — iOS Safari only fullscreens <video>, not the
  // wrapping <div>, hiding all DOM overlays. On iOS we redirect the
  // fullscreen button to the parent's "fake fullscreen" (cinema) overlay.
  // ===================================================================
  var isIOS =
    /(iPad|iPhone|iPod)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  var kgpFakeFullscreen = false;

  function kgpSetFakeFullscreen(state) {
    var next = !!state;
    if (kgpFakeFullscreen === next) return;
    kgpFakeFullscreen = next;
    art.emit('fullscreen', kgpFakeFullscreen);
  }

  function kgpToggleFakeFullscreen() {
    kgpSetFakeFullscreen(!kgpFakeFullscreen);
    postToParent({ action: 'toggleFullscreen' });
  }

  if (isIOS) {
    var kgpRedirectFullscreen = function () {
      kgpToggleFakeFullscreen();
      return Promise.resolve();
    };

    var $playerRoot = art.template.$player;
    if ($playerRoot) {
      $playerRoot.requestFullscreen = kgpRedirectFullscreen;
      $playerRoot.webkitRequestFullscreen = kgpRedirectFullscreen;
    }

    var $videoEl = art.template.$video;
    if ($videoEl && $videoEl.webkitEnterFullscreen) {
      $videoEl.webkitEnterFullscreen = kgpRedirectFullscreen;
    }
  }

  // ===================================================================
  // Center overlay controls (mobile only). Plain window functions so the
  // inline onclick handlers reach them; stopPropagation so a button tap
  // doesn't also toggle the video underneath.
  // ===================================================================
  window.__kgpRewind = function (e) {
    if (e) e.stopPropagation();
    art.seek = art.currentTime - 10;
  };
  window.__kgpForward = function (e) {
    if (e) e.stopPropagation();
    art.seek = art.currentTime + 10;
  };
  window.__kgpTogglePlay = function (e) {
    if (e) e.stopPropagation();
    // art.paused does NOT exist in Artplayer 5.4.0 — use the raw video.
    if (art.video.paused) {
      art.play();
    } else {
      art.pause();
    }
  };

  var KGP_PLAY_ICON = '<path fill="currentColor" d="M7 6.82v10.36c0 .79.87 1.27 1.54.84l8.14-5.18a1 1 0 0 0 0-1.68L8.54 5.98A1 1 0 0 0 7 6.82Z"/>';
  var KGP_PAUSE_ICON = '<path fill="currentColor" d="M8 5a1.5 1.5 0 0 0-1.5 1.5v11a1.5 1.5 0 0 0 3 0v-11A1.5 1.5 0 0 0 8 5Zm8 0a1.5 1.5 0 0 0-1.5 1.5v11a1.5 1.5 0 0 0 3 0v-11A1.5 1.5 0 0 0 16 5Z"/>';

  function kgpSyncCenterIcon() {
    var icon = document.getElementById('kgp-center-play-icon');
    if (!icon) return;
    var video = art.video;
    icon.innerHTML = video && video.paused && !video.ended
      ? KGP_PLAY_ICON
      : KGP_PAUSE_ICON;
  }

  art.on('video:playing', kgpSyncCenterIcon);
  art.on('video:pause', kgpSyncCenterIcon);
  art.on('video:ended', kgpSyncCenterIcon);

  // ===================================================================
  // BRIDGE: notify the parent window about player events.
  // ===================================================================
  function postToParent(payload) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, '*');
      }
    } catch (_) {}
  }

  art.on('video:ended', function () {
    postToParent({ event: 'ended' });
    postToParent('ended');
  });

  art.on('video:timeupdate', function () {
    postToParent({
      event: 'timeupdate',
      currentTime: art.currentTime,
      duration: art.duration,
      percentage: art.duration > 0 ? art.currentTime / art.duration : 0,
    });
  });

  art.on('ready', function () {
    postToParent({ event: 'ready', duration: art.duration });
  });

  art.on('video:error', function () {
    postToParent({ event: 'error' });
  });

  // ===================================================================
  // INBOUND: accept commands from the parent window.
  // ===================================================================
  window.addEventListener('message', function (e) {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.action === 'seek' && typeof e.data.time === 'number') {
      art.seek = e.data.time;
    }
    if (e.data.action === 'pause') art.pause();
    if (e.data.action === 'play') art.play();
    if (e.data.action === 'fullscreenState' && typeof e.data.state === 'boolean') {
      kgpSetFakeFullscreen(e.data.state);
    }
  });

  window.art = art;

  // ===================================================================
  // AUTOPLAY FALLBACK — try sound-first, fall back to muted + pill.
  // ===================================================================
  var kgpFallbackDone = false;

  function kgpShowUnmute() {
    var el = document.getElementById('kgp-unmute');
    if (el) el.classList.add('show');
  }
  function kgpHideUnmute() {
    var el = document.getElementById('kgp-unmute');
    if (el) el.classList.remove('show');
  }

  function kgpTryPlay(video) {
    var p = null;
    try { p = video.play(); } catch (_) { p = null; }
    if (p && typeof p.catch === 'function') p.catch(function () {});
    return p;
  }

  window.__kgpUnmute = function (e) {
    if (e) e.stopPropagation();
    try { art.muted = false; } catch (_) {}
    kgpTryPlay(art.video);
    kgpHideUnmute();
  };

  art.on('ready', function () {
    setTimeout(function () {
      var video = art.video;
      if (!video || kgpFallbackDone) return;

      var p = null;
      try { p = video.play(); } catch (_) { p = null; }

      if (p && typeof p.then === 'function') {
        p.then(function () {
          if (video.muted) kgpShowUnmute();
        }).catch(function () {
          if (video && !video.paused && !video.ended) return;
          kgpFallbackDone = true;
          try { art.muted = true; } catch (_) {}
          kgpTryPlay(video);
          kgpShowUnmute();
        });
      } else {
        setTimeout(function () {
          if (video.paused) {
            kgpFallbackDone = true;
            try { art.muted = true; } catch (_) {}
            kgpTryPlay(video);
            kgpShowUnmute();
          } else if (video.muted) {
            kgpShowUnmute();
          }
        }, 300);
      }
    }, 250);
  });

  art.on('video:playing', function () {
    if (art.video && !art.video.muted) kgpHideUnmute();
  });
  art.on('video:volumechange', function () {
    if (art.video && !art.video.muted) kgpHideUnmute();
  });
})();
</script>
</body>
</html>
