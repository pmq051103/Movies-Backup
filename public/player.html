<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Không Gian Phim Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #player { width: 100%; height: 100%; }

  /* ── Cursor + hover-to-reveal fix ────────────────────────────────
     Artplayer hides the OS cursor and the bottom control bar together
     under one internal "idle" state, and — inside an iframe — that
     state was flipping on click instead of tracking real mouse
     hover/movement, so the cursor vanished the moment you clicked
     and the bar only reappeared on another click. Two explicit,
     always-on overrides instead of Artplayer's internal state:
     1. Cursor is never hidden by the player, full stop.
     2. Plain CSS :hover reveals the bottom bar directly — no JS
        click-state involved, so hovering (not clicking) is what
        shows/hides it, like every other video site. */
  .art-video-player,
  .art-video-player .art-video,
  .art-video-player video {
    cursor: auto !important;
  }
  .art-video-player .art-bottom {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .art-video-player:hover .art-bottom,
  .art-video-player.art-hover .art-bottom,
  .art-video-player.art-control-show .art-bottom {
    opacity: 1 !important;
    pointer-events: auto !important;
  }

  /* ── Mobile control-bar fix ──────────────────────────────────────
     Verified against Artplayer 5.4.0's actual source (not guessed):
     controls never get a `data-name` attribute — that selector never
     matched anything. And `lock` isn't a bottom-bar control at all;
     it's a separate `.art-layer-lock` overlay, only auto-added when
     Artplayer's own UA sniffing thinks it's mobile — so it's disabled
     properly below via `lock: false` in the player config instead of
     (ineffectively) hiding it here. `aspectRatio` was never in the
     bottom bar either (it only lives in the settings/⚙ panel).

     What's ACTUALLY in the bottom bar on mobile (real classes, e.g.
     `.art-control-playAndPause`): rewind, play/pause, forward, volume,
     time text, next-episode, subtitle, setting, pip, fullscreen — too
     wide for a phone screen, pushing fullscreen off to the right.

     Fix: play/pause + rewind/forward now live in a big overlay on top
     of the video itself (#kgp-center-controls below), so their bottom-bar
     copies are hidden on mobile — freeing most of the row's width so
     fullscreen fits without scrolling. The custom "next episode" button
     is also dropped on mobile (users already have Danh sách tập below
     the player for that — PiP stays, it's genuinely useful on phones
     and was asked to be kept). */
  @media (max-width: 480px) {
    .art-bottom .art-control-fast-rewind,
    .art-bottom .art-control-fast-forward,
    .art-bottom .art-control-playAndPause,
    .art-bottom .art-control-kgp-next-episode {
      display: none !important;
    }
    .art-controls,
    .art-controls-left,
    .art-controls-right {
      gap: 2px !important;
    }
    .art-control {
      padding: 0 4px !important;
    }
    .art-icon svg {
      width: 20px !important;
      height: 20px !important;
    }
    .art-controls {
      overflow-x: auto !important;
      scrollbar-width: none !important;
    }
    .art-controls::-webkit-scrollbar {
      display: none !important;
    }

    /* Artplayer's own big center play/pause "state" icon
       (`.art-mask .art-state`) would otherwise sit right behind our
       custom overlay buttons and double up visually — it's replaced
       by #kgp-center-controls, so hide it on mobile only. */
    .art-mask .art-state {
      display: none !important;
    }
  }

  /* ── Center overlay controls (play/pause + ±10s) ─────────────────
     Mobile-only, YouTube-style: big, thumb-friendly buttons sitting
     directly on the video instead of squeezed into the bottom icon
     row. Desktop keeps the bottom-bar buttons (plenty of room there),
     so this overlay is hidden by default and only shown under the
     max-width:480px query. */
  #kgp-center-controls {
    display: none;
  }
  @media (max-width: 480px) {
    #kgp-center-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      width: 100%;
      pointer-events: none;
      /* Hidden by default, same as Artplayer's own bottom bar
         (`.art-bottom` starts at opacity:0) — only shown while
         `.art-control-show` / `.art-hover` is present on the player
         root, and faded out again after Artplayer's own auto-hide
         timer (CONTROL_HIDE_TIME) removes those classes. */
      opacity: 0;
      transition: opacity var(--art-transition-duration, .2s) ease;
    }
    .art-video-player.art-control-show #kgp-center-controls,
    .art-video-player.art-hover #kgp-center-controls {
      opacity: 1;
    }
    /* Buttons themselves must stop accepting taps while faded out —
       otherwise they'd still be clickable (just invisible) since
       `pointer-events` on a child isn't blocked by a `none` parent. */
    #kgp-center-controls button {
      pointer-events: none;
    }
    .art-video-player.art-control-show #kgp-center-controls button,
    .art-video-player.art-hover #kgp-center-controls button {
      pointer-events: auto;
    }
    #kgp-center-controls button {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      border: none;
      border-radius: 999px;
      color: #fff;
      padding: 0;
    }
    #kgp-center-controls .kgp-seek-btn {
      width: 44px;
      height: 44px;
    }
    #kgp-center-controls .kgp-seek-btn svg {
      width: 24px;
      height: 24px;
    }
    #kgp-center-controls .kgp-play-btn {
      width: 60px;
      height: 60px;
    }
    #kgp-center-controls .kgp-play-btn svg {
      width: 30px;
      height: 30px;
    }
  }

  /* ── "Bật tiếng" (unmute) pill ────────────────────────────────────
     Shown ONLY when the browser blocked sound-first autoplay and we
     fell back to muted autoplay (iOS Safari in particular). Once shown
     it STAYS visible until the user taps it — it never fades out with
     the controls. It just tracks the control bar vertically: when the
     bar slides down out of view the pill slides DOWN to the bottom
     edge (bottom: 8px), and rises back above the bar (bottom: 52px)
     when the controls show again. */
  #kgp-unmute {
    display: none;
  }
  #kgp-unmute.show {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .art-layer-kgp-unmute {
    bottom: 8px;
    transition: bottom var(--art-transition-duration, .2s) ease;
  }
  .art-video-player.art-control-show .art-layer-kgp-unmute,
  .art-video-player.art-hover .art-layer-kgp-unmute {
    bottom: 52px;
  }
  #kgp-unmute .kgp-unmute-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    pointer-events: auto;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  #kgp-unmute .kgp-unmute-btn:hover {
    background: rgba(0, 0, 0, 0.8);
  }
  #kgp-unmute .kgp-unmute-btn svg {
    flex-shrink: 0;
  }

  /* ── "Phụ đề" (CC) popup — cloned from the reference screenshots ───
     A white rounded card: Bật / Song ngữ / Tắt segmented control up top,
     two side-by-side language lists below, and a gear icon that swaps
     the whole panel for the "Tuỳ chỉnh" text-style editor. Positioned
     like a real subtitle-settings popover, anchored above the CC button. */
  .kgp-cc-popup {
    display: none;
    position: absolute;
    right: 16px;
    bottom: 64px;
    width: 300px;
    max-width: calc(100vw - 24px);
    background: #fff;
    color: #17171a;
    border-radius: 14px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    z-index: 40;
  }
  .kgp-cc-popup.show { display: block; }
  .kgp-cc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 4px;
  }
  .kgp-cc-head strong { font-size: 14px; font-weight: 700; }
  .kgp-cc-iconbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: #444;
    cursor: pointer;
  }
  .kgp-cc-iconbtn:hover { background: #f0f0f0; }
  .kgp-cc-segment {
    display: flex;
    gap: 4px;
    margin: 8px 14px 12px;
    background: #f1f1f3;
    border-radius: 999px;
    padding: 3px;
  }
  .kgp-cc-segment button {
    flex: 1;
    border: none;
    background: transparent;
    border-radius: 999px;
    padding: 6px 0;
    font-size: 12.5px;
    font-weight: 600;
    color: #555;
    cursor: pointer;
  }
  .kgp-cc-segment button.active { background: #17171a; color: #fff; }
  .kgp-cc-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 8px;
    padding: 0 14px 12px;
  }
  .kgp-cc-cols.single { grid-template-columns: 1fr; }
  .kgp-cc-col-title {
    font-size: 11px;
    font-weight: 700;
    color: #17171a;
    padding: 6px 6px;
    border-bottom: 1px solid #ececec;
    margin-bottom: 2px;
  }
  .kgp-cc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 6px;
    border-radius: 8px;
    font-size: 13px;
    color: #333;
    cursor: pointer;
  }
  .kgp-cc-row:hover { background: #f5f5f5; }
  .kgp-cc-row.selected { background: #eef6ff; font-weight: 700; color: #0f6fde; }
  .kgp-cc-row .kgp-check { opacity: 0; font-size: 11px; }
  .kgp-cc-row.selected .kgp-check { opacity: 1; }
  .kgp-cc-note {
    padding: 0 14px 14px;
    font-size: 11.5px;
    color: #8a8a8a;
    line-height: 1.5;
  }

  /* ── "Tuỳ chỉnh" (subtitle style editor) sub-panel ── */
  .kgp-cc-custom { display: none; padding: 6px 0 10px; }
  .kgp-cc-custom.show { display: block; }
  .kgp-cc-custom-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px 4px;
    font-size: 13px;
    font-weight: 700;
  }
  .kgp-cc-custom-head button {
    border: none;
    background: transparent;
    color: #444;
    cursor: pointer;
    display: inline-flex;
  }
  .kgp-cc-group-label {
    padding: 10px 14px 4px;
    font-size: 11px;
    font-weight: 700;
    color: #9a9a9a;
    text-transform: none;
  }
  .kgp-cc-opt {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 14px;
    font-size: 13px;
    color: #333;
  }
  .kgp-cc-opt-val {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #666;
    font-size: 12.5px;
  }
  .kgp-cc-dot {
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #ccc;
    display: inline-block;
  }
  .kgp-cc-scroll {
    max-height: 340px;
    overflow-y: auto;
  }
</style>
</head>
<body>
<div id="player"></div>

<!-- Same versions as player.phimapi.com -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.4.0/artplayer.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script>
(function () {
  'use strict';

  var params = new URLSearchParams(window.location.search);
  var videoUrl = params.get('url');
  if (!videoUrl) {
    document.body.innerHTML = '<p style="color:#fff;text-align:center;margin-top:40vh">No video URL provided.</p>';
    return;
  }

  // Determine if this is an m3u8 (HLS) or direct mp4 URL
  var isHls = /\.m3u8/i.test(videoUrl);

  var art = new Artplayer({
    container: '#player',
    url: videoUrl,
    muted: false,
    autoplay: true,
    autoSize: false,
    autoMini: true,
    loop: false,
    mutex: true,
    setting: true,
    pip: true,
    flip: false,
    // Lock button removed per request — was mobile-only anyway (see
    // CSS note above) and this fully disables the plugin rather than
    // just hiding it, so no leftover DOM/behavior.
    lock: false,
    fastForward: true,
    playbackRate: true,
    aspectRatio: true,
    theme: '#FECF59',
    fullscreen: true,
    fullscreenWeb: false,
    miniProgressBar: true,
    autoOrientation: true,
    lang: 'vietnamese',
    i18n: {
      vietnamese: {
        Play: 'Phát',
        Pause: 'Dừng',
        'Show Setting': 'Cài đặt',
        'PIP Mode': 'Ảnh-trong-ảnh',
        Fullscreen: 'Phóng to',
        'Play Speed': 'Tốc độ phát',
        'Aspect Ratio': 'Tỷ lệ khung hình',
        Normal: 'Bình thường',
        'Video Info': 'Thông tin Video',
        Close: 'Đóng',
        Default: 'Mặc định',
      },
    },
    layers: [
      {
        name: 'kgp-logo',
        html:
          '<a id="kgp-logo-link" style="display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);text-decoration:none;cursor:pointer;">' +
          '<img src="/logo.png" alt="Không Gian Phim" style="width:20px;height:20px;border-radius:999px;object-fit:cover;" />' +
          '<span style="font-size:12px;font-weight:600;color:#fff;white-space:nowrap;">Không Gian Phim</span>' +
          '</a>',
        style: {
          position: 'absolute',
          top: '12px',
          left: '12px',
          zIndex: 30,
          pointerEvents: 'auto',
        },
        click: function () {
          postToParent({ action: 'navigateHome' });
        },
      },
      {
        // Mobile-only overlay: play/pause + ±10s seek, centered on the
        // video itself. See the #kgp-center-controls CSS above for why
        // — this is what lets the bottom icon row shrink enough for
        // fullscreen to stop being pushed off-screen on narrow phones.
        name: 'kgp-center-controls',
        html:
          '<div id="kgp-center-controls">' +
            '<button type="button" class="kgp-seek-btn" aria-label="Tua lùi 10 giây" onclick="window.__kgpRewind(event)">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path fill="currentColor" d="M4 18A12 12 0 1 0 16 6h-4V1L6 7l6 6V8h4A10 10 0 1 1 6 18Z"/><path fill="currentColor" d="M19.63 22.13a2.84 2.84 0 0 1-1.28-.27 2.44 2.44 0 0 1-.89-.77 3.6 3.6 0 0 1-.52-1.25 7.7 7.7 0 0 1-.17-1.68 8 8 0 0 1 .17-1.68 3.7 3.7 0 0 1 .52-1.25 2.44 2.44 0 0 1 .89-.77 2.84 2.84 0 0 1 1.28-.27 2.44 2.44 0 0 1 2.16 1 5.23 5.23 0 0 1 .7 2.93 5.23 5.23 0 0 1-.7 2.93 2.44 2.44 0 0 1-2.16 1.08m0-1.22a1.07 1.07 0 0 0 1-.55 3.4 3.4 0 0 0 .37-1.51v-1.38a3.3 3.3 0 0 0-.29-1.5 1.23 1.23 0 0 0-2.06 0 3.3 3.3 0 0 0-.29 1.5v1.38a3.4 3.4 0 0 0 .29 1.51 1.06 1.06 0 0 0 .98.55m-9 1.09v-1.18h2v-5.19l-1.86 1-.55-1.06 2.32-1.3H14v6.5h1.78V22z"/></svg>' +
            '</button>' +
            '<button type="button" id="kgp-center-play-btn" class="kgp-play-btn" aria-label="Phát / Dừng" onclick="window.__kgpTogglePlay(event)">' +
              '<svg id="kgp-center-play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>' +
            '</button>' +
            '<button type="button" class="kgp-seek-btn" aria-label="Tua tới 10 giây" onclick="window.__kgpForward(event)">' +
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><path fill="currentColor" d="M26 18A10 10 0 1 1 16 8h4v5l6-6-6-6v5h-4a12 12 0 1 0 12 12Z"/><path fill="currentColor" d="M19.63 22.13a2.84 2.84 0 0 1-1.28-.27 2.44 2.44 0 0 1-.89-.77 3.6 3.6 0 0 1-.52-1.25 7.7 7.7 0 0 1-.17-1.68 8 8 0 0 1 .17-1.68 3.7 3.7 0 0 1 .52-1.25 2.44 2.44 0 0 1 .89-.77 2.84 2.84 0 0 1 1.28-.27 2.44 2.44 0 0 1 2.16 1 5.23 5.23 0 0 1 .7 2.93 5.23 5.23 0 0 1-.7 2.93 2.44 2.44 0 0 1-2.16 1.08m0-1.22a1.07 1.07 0 0 0 1-.55 3.4 3.4 0 0 0 .37-1.51v-1.38a3.3 3.3 0 0 0-.29-1.5 1.23 1.23 0 0 0-2.06 0 3.3 3.3 0 0 0-.29 1.5v1.38a3.4 3.4 0 0 0 .29 1.51 1.06 1.06 0 0 0 .98.55m-9 1.09v-1.18h2v-5.19l-1.86 1-.55-1.06 2.32-1.3H14v6.5h1.78V22z"/></svg>' +
            '</button>' +
          '</div>',
        style: {
          position: 'absolute',
          top: '0',
          left: '0',
          width: '100%',
          height: '100%',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          zIndex: 20,
          pointerEvents: 'none',
        },
      },
      {
        // Unmute pill — bottom-left. Only shown while the muted-autoplay
        // fallback is active AND the player controls are visible, so it
        // follows the control bar: it fades out together with the controls
        // and returns with them until the user has unmuted (then gone).
        name: 'kgp-unmute',
        html:
          '<div id="kgp-unmute">' +
            '<button type="button" class="kgp-unmute-btn" aria-label="Bật tiếng" onclick="window.__kgpUnmute(event)">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"><path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>' +
              '<span>Bật tiếng</span>' +
            '</button>' +
          '</div>',
        style: {
          position: 'absolute',
          left: '12px',
          zIndex: 50,
          pointerEvents: 'none',
        },
      },
      {
        // "Phụ đề" (CC) popup — see .kgp-cc-popup CSS above. Two views
        // inside the same layer: the main Bật/Song ngữ/Tắt + language
        // list (.kgp-cc-main) and the "Tuỳ chỉnh" style editor
        // (.kgp-cc-custom), toggled via kgpCcShowCustom()/kgpCcShowMain().
        name: 'kgp-cc-popup',
        html:
          '<div class="kgp-cc-popup" id="kgp-cc-popup">' +
            '<div class="kgp-cc-main" id="kgp-cc-main">' +
              '<div class="kgp-cc-head">' +
                '<strong>Phụ đề</strong>' +
                '<button type="button" class="kgp-cc-iconbtn" title="Tuỳ chỉnh" onclick="window.__kgpCcShowCustom(event)">' +
                  '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94L14.4 2.8a.49.49 0 0 0-.49-.42h-3.84a.49.49 0 0 0-.49.42l-.36 2.54a7.3 7.3 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.68 8.86a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.5.4 1.05.71 1.63.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .44-.18.49-.42l.36-2.54c.58-.23 1.13-.54 1.63-.94l2.39.96c.24.1.5 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>' +
                '</button>' +
              '</div>' +
              '<div class="kgp-cc-segment" id="kgp-cc-segment">' +
                '<button type="button" data-mode="on" onclick="window.__kgpCcSetMode(event,\'on\')">Bật</button>' +
                '<button type="button" data-mode="dual" class="active" onclick="window.__kgpCcSetMode(event,\'dual\')">Song ngữ</button>' +
                '<button type="button" data-mode="off" onclick="window.__kgpCcSetMode(event,\'off\')">Tắt</button>' +
              '</div>' +
              '<div class="kgp-cc-cols" id="kgp-cc-cols"></div>' +
              '<p class="kgp-cc-note">Phụ đề do nguồn phát cung cấp — ngôn ngữ hiển thị tuỳ theo bản phát hành của từng phim.</p>' +
            '</div>' +
            '<div class="kgp-cc-custom kgp-cc-scroll" id="kgp-cc-custom">' +

  // iOS Safari only has PARTIAL Fullscreen API support: it only honours

  // div and hands the video to the NATIVE fullscreen player instead,
  // which renders no DOM at all — so the logo layer (and our center
  // controls / unmute pill) vanish on iOS, while Android and desktop
  // DOM-fullscreen the container and keep the layers visible.
  //
  // Fix: on iOS we never enter native fullscreen. The fullscreen button
  // (and double-tap) is redirected to ask the PARENT page to
  // "fake-fullscreen" the whole player via a fixed full-viewport overlay
  // (the parent already does exactly this for its cinema mode). Inside
  // that overlay the iframe scales up to fill the screen, so the
  // in-player logo layer stays visible — matching Android / desktop.

    // and autoOrientation safely no-ops on iOS (no orientation lock API).

    // resolved promise is returned so Artplayer's internal promise
    // machinery (Mt.request) never hangs waiting for a fullscreenchange
    // that will never fire.
    var kgpRedirectFullscreen = function () {
      kgpToggleFakeFullscreen();

  // ===================================================================

          kgpShowUnmute();
        });
      } else {
        // No Promise support (very old browsers) — check state directly.
        setTimeout(function () {
          if (video.paused) {
            kgpFallbackDone = true;
            try { art.muted = true; } catch (_) {}
            kgpTryPlay(video);
            kgpShowUnmute();
          } else if (video.muted) {
            kgpShowUnmute();
          }
        }, 300);
      }
    }, 250);
  });

  // If the user later unmutes through the player's own controls, drop
  // the pill for good — it was a first-time fallback hint only.
  art.on('video:playing', function () {
    if (art.video && !art.video.muted) kgpHideUnmute();
  });
  art.on('video:volumechange', function () {
    if (art.video && !art.video.muted) kgpHideUnmute();
  });
})();
</script>
