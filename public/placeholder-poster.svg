<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="300" height="450" fill="url(#bg)"/>

  <!-- Film reel body -->
  <g transform="translate(150,185)">
    <!-- Main frame -->
    <rect x="-44" y="-36" width="88" height="72" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>

    <!-- Film strip holes left -->
    <circle cx="-40" cy="-22" r="4.5" fill="#374151"/>
    <circle cx="-40" cy="0" r="4.5" fill="#374151"/>
    <circle cx="-40" cy="22" r="4.5" fill="#374151"/>

    <!-- Film strip holes right -->
    <circle cx="40" cy="-22" r="4.5" fill="#374151"/>
    <circle cx="40" cy="0" r="4.5" fill="#374151"/>
    <circle cx="40" cy="22" r="4.5" fill="#374151"/>

    <!-- Red screen -->
    <rect x="-26" y="-18" width="52" height="36" rx="4" fill="#dc2626" opacity="0.75"/>

    <!-- Play circle -->
    <circle cx="0" cy="0" r="8" fill="#f87171" opacity="0.5"/>

    <!-- Bottom strip -->
    <rect x="-22" y="40" width="44" height="8" rx="3" fill="#374151"/>
  </g>

  <!-- Text -->
  <text x="150" y="280" text-anchor="middle" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CHƯA CẬP NHẬT ẢNH</text>

  <!-- Subtle glow -->
  <ellipse cx="150" cy="410" rx="60" ry="30" fill="#dc2626" opacity="0.05"/>
</svg>
